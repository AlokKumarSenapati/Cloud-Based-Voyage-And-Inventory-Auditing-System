# =====================================================================
# AWS Production Configuration Profile: "prod"
# =====================================================================

spring.application.name=cloud-voyage-api
server.port=${PORT:8080}

# AWS RDS MySQL Database Configuration
# RDS_ENDPOINT example: cloudvoyage-db.xxxxxx.us-east-1.rds.amazonaws.com
spring.datasource.url=jdbc:mysql://${RDS_ENDPOINT:localhost}:3306/${RDS_DB_NAME:cloud_voyage_audit}?useSSL=true&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${RDS_USERNAME:admin}
spring.datasource.password=${RDS_PASSWORD}

# Production JPA / Hibernate settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# AWS S3 Storage for Audit Reports
cloud.aws.region.static=${AWS_REGION:us-east-1}
cloud.aws.s3.bucket=${S3_BUCKET_NAME:cloud-voyage-audit-reports}

# Security and Logging
logging.level.root=INFO
logging.level.com.cloudvoyage=INFO

